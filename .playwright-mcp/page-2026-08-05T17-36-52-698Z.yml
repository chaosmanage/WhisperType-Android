              - paragraph [ref=e425]: The Gemini Live API allows for real-time, bidirectional interaction with Gemini models, supporting audio, video, and text inputs and native audio outputs. This guide explains how to integrate directly with the API using raw WebSockets.
              - generic [ref=e426]:
                - link "Try the Live API in Google AI Studio" [ref=e427] [cursor=pointer]:
