              - heading "Overview" [level=2] [ref=e430]
              - paragraph [ref=e431]: The Gemini Live API uses WebSockets for real-time communication. Unlike using an SDK, this approach involves directly managing the WebSocket connection and sending/receiving messages in a specific JSON format defined by the API.
              - paragraph [ref=e432]: "Key concepts:"
              - list [ref=e433]:
                - listitem [ref=e434]:
                  - strong [ref=e435]: WebSocket Endpoint
                  - text: ": The specific URL to connect to."
                - listitem [ref=e436]:
                  - strong [ref=e437]: Message Format
                  - text: ": All communication is done via JSON messages conforming to"
                  - link [ref=e438] [cursor=pointer]:
                    - /url: /api/live#bidigeneratecontentclientmessage
                    - code [ref=e439]: BidiGenerateContentClientMessage
                  - text: and
                  - link [ref=e440] [cursor=pointer]:
                    - /url: /api/live#bidigeneratecontentservermessage
                    - code [ref=e441]: BidiGenerateContentServerMessage
                  - text: structures.
                - listitem [ref=e442]:
                  - strong [ref=e443]: Session Management
                  - text: ": You are responsible for maintaining the WebSocket connection."
              - heading "Authentication" [level=2] [ref=e444]
              - paragraph [ref=e445]: Authentication is handled by including your API key as a query parameter in the WebSocket URL.
              - paragraph [ref=e446]: "The endpoint format is:"
              - code [ref=e449]: wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=YOUR_API_KEY
              - paragraph [ref=e450]:
                - text: Replace
                - code [ref=e451]: YOUR_API_KEY
                - text: with your actual API key.
              - heading "Authentication with ephemeral tokens" [level=2] [ref=e452]
              - paragraph [ref=e453]:
                - text: If you are using
                - link "ephemeral tokens" [ref=e454] [cursor=pointer]:
                  - /url: /gemini-api/docs/ephemeral-tokens
                - text: ", you need to connect to the"
                - code [ref=e455]: v1beta
                - text: endpoint. The ephemeral token needs to be passed as an
                - code [ref=e456]: access_token
                - text: query parameter.
              - paragraph [ref=e457]: "The endpoint format for ephemeral keys is:"
              - code [ref=e460]: "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token={short-lived-token}"
              - paragraph [ref=e461]:
                - text: Replace
                - code [ref=e462]: "{short-lived-token}"
                - text: with the actual ephemeral token.
              - heading "Connect to the Live API" [level=2] [ref=e463]
