            - generic [ref=e383]:
              - text: The
              - link "Interactions API" [ref=e384] [cursor=pointer]:
                - /url: /gemini-api/docs/interactions-overview
              - text: is now generally available. We recommend using this API for access to all the latest features and models.
            - navigation [ref=e385]:
              - list "Breadcrumb" [ref=e386]:
                - listitem [ref=e387]:
                  - link "Home" [ref=e388] [cursor=pointer]:
                    - /url: https://ai.google.dev/
                - listitem [ref=e389]:
                  - generic [ref=e390]: chevron_right
                  - link "Gemini API" [ref=e391] [cursor=pointer]:
                    - /url: https://ai.google.dev/gemini-api
                - listitem [ref=e392]:
                  - generic [ref=e393]: chevron_right
                  - link "Docs" [ref=e394] [cursor=pointer]:
                    - /url: https://ai.google.dev/gemini-api/docs
            - heading [level=1] [ref=e395]:
              - text: Session management with Live API
              - group "LLM Tools" [ref=e398]:
                - button "Copy page as markdown" [ref=e400] [cursor=pointer]:
                  - generic [ref=e401]: content_copy
                - button "More LLM Tools options" [ref=e404] [cursor=pointer]: arrow_drop_down
            - text: expand_more more_horiz
            - generic [ref=e405]:
              - paragraph
              - paragraph [ref=e406]:
                - text: In the Live API, a session refers to a persistent connection where input and output are streamed continuously over the same connection (read more about
                - link "how it works" [ref=e407] [cursor=pointer]:
                  - /url: /gemini-api/docs/live
                - text: ). This unique session design enables low latency and supports unique features, but can also introduce challenges, like session time limits, and early termination. This guide covers strategies for overcoming the session management challenges that can arise when using the Live API.
              - heading "Session lifetime" [level=2] [ref=e408]
              - paragraph [ref=e409]:
                - text: Without compression, audio-only sessions are limited to 15 minutes, and audio-video sessions are limited to 2 minutes. Exceeding these limits will terminate the session (and therefore, the connection), but you can use
                - link "context window compression" [ref=e410] [cursor=pointer]:
                  - /url: "#context-window-compression"
                - text: to extend sessions to an unlimited amount of time.
              - paragraph [ref=e411]:
                - text: The lifetime of a connection is limited as well, to around 10 minutes. When the connection terminates, the session terminates as well. In this case, you can configure a single session to stay active over multiple connections using
                - link "session resumption" [ref=e412] [cursor=pointer]:
                  - /url: "#session-resumption"
                - text: . You'll also receive a
                - link "GoAway message" [ref=e413] [cursor=pointer]:
                  - /url: "#goaway-message"
                - text: before the connection ends, allowing you to take further actions.
              - heading "Context window compression" [level=2] [ref=e414]
              - paragraph [ref=e415]:
                - text: To enable longer sessions, and avoid abrupt connection termination, you can enable context window compression by setting the
                - link "contextWindowCompression" [ref=e416] [cursor=pointer]:
                  - /url: /api/live#BidiGenerateContentSetup.FIELDS.ContextWindowCompressionConfig.BidiGenerateContentSetup.context_window_compression
                - text: field as part of the session configuration.
              - paragraph [ref=e417]:
                - text: In the
                - link "ContextWindowCompressionConfig" [ref=e418] [cursor=pointer]:
                  - /url: /api/live#contextwindowcompressionconfig
                - text: ", you can configure a"
                - link "sliding-window mechanism" [ref=e419] [cursor=pointer]:
                  - /url: /api/live#ContextWindowCompressionConfig.FIELDS.ContextWindowCompressionConfig.SlidingWindow.ContextWindowCompressionConfig.sliding_window
                - text: and the
                - link "number of tokens" [ref=e420] [cursor=pointer]:
                  - /url: /api/live#ContextWindowCompressionConfig.FIELDS.int64.ContextWindowCompressionConfig.trigger_tokens
                - text: that triggers compression.
              - generic [ref=e422]:
                - tablist [ref=e423]:
                  - generic [ref=e424]:
                    - tab [selected] [ref=e425]:
                      - button "Python" [expanded] [ref=e426] [cursor=pointer]
                    - tab [ref=e427]:
                      - button "JavaScript" [ref=e428] [cursor=pointer]
                    - tab [ref=e429]:
                      - button "More Options" [ref=e430] [cursor=pointer]: arrow_drop_down More
                - tabpanel "Python" [ref=e431]:
                  - code [ref=e434]: "from google.genai import types config = types.LiveConnectConfig( response_modalities=[\"AUDIO\"], context_window_compression=( # Configures compression with default parameters. types.ContextWindowCompressionConfig( sliding_window=types.SlidingWindow(), ) ), )"
              - heading "Session resumption" [level=2] [ref=e435]
              - paragraph [ref=e436]:
                - text: To prevent session termination when the server periodically resets the WebSocket connection, configure the
                - link "sessionResumption" [ref=e437] [cursor=pointer]:
                  - /url: /api/live#BidiGenerateContentSetup.FIELDS.SessionResumptionConfig.BidiGenerateContentSetup.session_resumption
                - text: field within the
                - link "setup configuration" [ref=e438] [cursor=pointer]:
                  - /url: /api/live#BidiGenerateContentSetup
                - text: .
              - paragraph [ref=e439]:
                - text: Passing this configuration causes the server to send
                - link "SessionResumptionUpdate" [ref=e440] [cursor=pointer]:
                  - /url: /api/live#SessionResumptionUpdate
                - text: messages, which can be used to resume the session by passing the last resumption token as the
                - link [ref=e441] [cursor=pointer]:
                  - /url: /api/live#SessionResumptionConfig.FIELDS.string.SessionResumptionConfig.handle
                  - code [ref=e442]: SessionResumptionConfig.handle
                - text: of the subsequent connection.
              - paragraph [ref=e443]: Resumption tokens are valid for 2 hr after the last sessions termination.
