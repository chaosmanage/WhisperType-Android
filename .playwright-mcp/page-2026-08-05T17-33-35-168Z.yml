              - heading "Use cases" [level=2] [ref=e415]
              - paragraph [ref=e416]: "Live API can be used to build real-time voice agents for a variety of industries, including:"
              - list [ref=e417]:
                - listitem [ref=e418]:
                  - strong [ref=e419]: "E-commerce and retail:"
                  - text: Shopping assistants that offer personalized recommendations and support agents that resolve customer issues.
                - listitem [ref=e420]:
                  - strong [ref=e421]: "Gaming:"
                  - text: Interactive non-player characters (NPCs), in-game help assistants, and real-time translation of in-game content.
                - listitem [ref=e422]:
                  - strong [ref=e423]: "Next-gen interfaces:"
                  - text: Voice- and video-enabled experiences in robotics, smart glasses, and vehicles.
                - listitem [ref=e424]:
                  - strong [ref=e425]: "Healthcare:"
                  - text: Health companions for patient support and education.
                - listitem [ref=e426]:
                  - strong [ref=e427]: "Financial services:"
                  - text: AI advisors for wealth management and investment guidance.
                - listitem [ref=e428]:
                  - strong [ref=e429]: "Education:"
                  - text: AI mentors and learner companions that provide personalized instruction and feedback.
                - listitem [ref=e430]:
                  - strong [ref=e431]: "Translation and localization:"
                  - text: Real-time, low-latency translation of spoken conversations, enabling seamless multilingual communication.
              - heading "Key features" [level=2] [ref=e432]
              - paragraph [ref=e433]: "Live API offers a comprehensive set of features for building robust voice agents:"
              - list [ref=e434]:
