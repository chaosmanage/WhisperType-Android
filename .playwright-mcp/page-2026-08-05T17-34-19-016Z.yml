              - heading "Understanding VAD parameters and their impact on quality" [level=3] [ref=e971]
              - paragraph [ref=e972]: "When using automatic VAD, two key parameters control how audio is segmented into speech turns before being sent to the model:"
              - list [ref=e973]:
                - listitem [ref=e974]:
                  - strong [ref=e975]:
                    - code [ref=e976]: prefixPaddingMs
                  - text: ": The amount of audio to include"
                  - emphasis [ref=e977]: before
                  - text: speech is detected. This "look-back" ensures the model captures the full onset of speech, including the first syllable which may start before the VAD triggers. A value of
                  - code [ref=e978]: "0"
                  - text: may cause the beginning of words to be clipped.
                - listitem [ref=e979]:
                  - strong [ref=e980]:
                    - code [ref=e981]: silenceDurationMs
                  - text: ": How long the server waits through silence before ending a speech turn. This determines how tolerant the system is of natural mid-sentence pauses (e.g., thinking, breathing, or clause boundaries)."
              - heading [level=4] [ref=e982]:
                - text: Impact of
                - code [ref=e983]: silenceDurationMs
                - text: on audio quality
              - paragraph [ref=e984]:
                - text: The
                - code [ref=e985]: silenceDurationMs
                - text: "value directly affects the size and completeness of audio chunks the model receives for processing:"
              - list [ref=e986]:
                - listitem [ref=e987]:
                  - strong [ref=e988]: "Recommended (500ms–800ms):"
                  - text: Provides a good balance—the model receives complete, contextually rich audio chunks while keeping latency reasonable. The server's internal default is approximately 800ms.
                - listitem [ref=e989]:
                  - strong [ref=e990]: "Too low (e.g., 100ms–200ms):"
                  - text: The system ends speech turns during natural pauses, splitting a single utterance into multiple small audio fragments. The model receives these fragments individually, losing cross-fragment context and resulting in lower transcription and response quality.
                - listitem [ref=e991]:
                  - strong [ref=e992]: "Too high (e.g., 2000ms+):"
                  - text: The system waits a long time after the user stops speaking, increasing perceived latency before the model responds.
              - heading "Best practices for manual (client-side) VAD" [level=4] [ref=e993]
              - paragraph [ref=e994]:
                - text: When you disable automatic VAD and manage
                - code [ref=e995]: activityStart
                - text: /
                - code [ref=e996]: activityEnd
                - text: "signals from your own client-side voice detection, be aware that the server's built-in audio buffering mechanisms are bypassed. This means:"
              - list [ref=e997]:
                - listitem [ref=e998]:
                  - strong [ref=e999]: "No pre-speech buffer:"
                  - text: The server no longer prepends audio before the detected speech start. Your client should include sufficient audio context before sending
                  - code [ref=e1000]: activityStart
                  - text: .
                - listitem [ref=e1001]:
                  - strong [ref=e1002]: "No silence tolerance:"
                  - text: The server acts immediately on your
                  - code [ref=e1003]: activityEnd
                  - text: signal with no additional wait. If your client-side VAD uses an aggressive end-of-speech threshold (e.g., 200ms of silence), speech may be cut off mid-sentence during natural pauses.
              - paragraph [ref=e1004]:
                - text: To preserve audio quality with manual VAD, use an end-of-speech silence threshold of at least
                - strong [ref=e1005]: 500ms
                - text: in your client's voice activity detector. Thresholds below this value often cause fragmented audio that degrades transcription and model response quality.
              - heading "Token count" [level=2] [ref=e1006]
              - paragraph [ref=e1007]:
                - text: You can find the total number of consumed tokens in the
                - link "usageMetadata" [ref=e1008] [cursor=pointer]:
                  - /url: /api/live#usagemetadata
                - text: field of the returned server message.
              - generic [ref=e1010]:
