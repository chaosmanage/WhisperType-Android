              - heading "Limitations" [level=2] [ref=e1040]
              - paragraph [ref=e1041]: Consider the following limitations of the Live API when you plan your project.
              - heading "Response modalities" [level=3] [ref=e1042]
              - paragraph [ref=e1043]:
                - text: "The native audio models only support `AUDIO response modality. If you need the model response as text, use the"
                - link "output audio transcription" [ref=e1044] [cursor=pointer]:
                  - /url: "#audio-transcription"
                - text: feature.
              - heading "Client authentication" [level=3] [ref=e1045]
              - paragraph [ref=e1046]:
                - text: The Live API only provides server-to-server authentication by default. If you're implementing your Live API application using a
                - link "client-to-server approach" [ref=e1047] [cursor=pointer]:
                  - /url: /gemini-api/docs/live#implementation-approach
                - text: ", you need to use"
                - link "ephemeral tokens" [ref=e1048] [cursor=pointer]:
                  - /url: /gemini-api/docs/ephemeral-tokens
                - text: to mitigate security risks.
              - heading "Session duration" [level=3] [ref=e1049]
              - paragraph [ref=e1050]:
                - text: Audio-only sessions are limited to 15 minutes, and audio plus video sessions are limited to 2 minutes. However, you can configure different
                - link "session management techniques" [ref=e1051] [cursor=pointer]:
                  - /url: /gemini-api/docs/live-session
                - text: for unlimited extensions on session duration.
              - heading "Context window" [level=3] [ref=e1052]
              - paragraph [ref=e1053]: "A session has a context window limit of:"
              - list [ref=e1054]:
                - listitem [ref=e1055]:
                  - text: 128k tokens for
                  - link "native audio output" [ref=e1056] [cursor=pointer]:
                    - /url: "#native-audio-output"
                  - text: models
                - listitem [ref=e1057]: 32k tokens for other Live API models
              - heading "Supported languages" [level=2] [ref=e1058]
              - paragraph [ref=e1059]: Live API supports the following 97 languages.
              - complementary [ref=e1060]:
                - strong [ref=e1061]: "Note:"
                - generic [ref=e1062]:
                  - link "Native audio output" [ref=e1063] [cursor=pointer]:
                    - /url: "#native-audio-output"
                  - text: models can switch between languages naturally during conversation. You can also restrict the languages it speaks in by specifying it in the system instructions.
