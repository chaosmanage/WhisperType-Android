              - heading "Live translation" [level=2] [ref=e879]
              - paragraph [ref=e880]: The Live API supports real-time, low-latency translation of spoken conversations. This capability lets you build real-time voice-to-voice translation applications.
              - paragraph [ref=e881]:
                - text: For more information and examples, see the
                - link "Live Translation guide" [ref=e882] [cursor=pointer]:
                  - /url: /gemini-api/docs/live-api/live-translate
                - text: .
              - heading "Voice Activity Detection (VAD)" [level=2] [ref=e883]
              - paragraph [ref=e884]: Voice Activity Detection (VAD) allows the model to recognize when a person is speaking. This is essential for creating natural conversations, as it allows a user to interrupt the model at any time.
              - paragraph [ref=e885]:
                - text: When VAD detects an interruption, the ongoing generation is canceled and discarded. Only the information already sent to the client is retained in the session history. The server then sends a
                - link [ref=e886] [cursor=pointer]:
                  - /url: /api/live#bidigeneratecontentservercontent
                  - code [ref=e887]: BidiGenerateContentServerContent
                - text: message to report the interruption.
              - paragraph [ref=e888]:
                - text: The Gemini server then discards any pending function calls and sends a
                - code [ref=e889]: BidiGenerateContentServerContent
                - text: message with the IDs of the canceled calls.
              - generic [ref=e891]:
                - tablist [ref=e892]:
                  - generic [ref=e893]:
                    - tab [selected] [ref=e894]:
                      - button "Python" [expanded] [ref=e895] [cursor=pointer]
                    - tab [ref=e896]:
                      - button "JavaScript" [ref=e897] [cursor=pointer]
                    - tab [ref=e898]:
                      - button "More Options" [ref=e899] [cursor=pointer]: arrow_drop_down More
                - tabpanel "Python" [ref=e900]:
                  - code [ref=e903]: "async for response in session.receive(): if response.server_content.interrupted is True: # The generation was interrupted # If realtime playback is implemented in your application, # you should stop playing audio and clear queued playback here."
              - heading "Automatic VAD" [level=3] [ref=e904]
              - paragraph [ref=e905]:
                - text: By default, the model automatically performs VAD on a continuous audio input stream. VAD can be configured with the
                - link [ref=e906] [cursor=pointer]:
                  - /url: /api/live#RealtimeInputConfig.AutomaticActivityDetection
                  - code [ref=e907]: realtimeInputConfig.automaticActivityDetection
                - text: field of the
                - link "setup configuration" [ref=e908] [cursor=pointer]:
                  - /url: /api/live#BidiGenerateContentSetup
                - text: .
              - paragraph [ref=e909]:
                - text: When the audio stream is paused for more than a second (for example, because the user switched off the microphone), an
                - link [ref=e910] [cursor=pointer]:
                  - /url: /api/live#BidiGenerateContentRealtimeInput.FIELDS.bool.BidiGenerateContentRealtimeInput.audio_stream_end
                  - code [ref=e911]: audioStreamEnd
                - text: event should be sent to flush any cached audio. The client can resume sending audio data at any time.
              - generic [ref=e913]:
                - tablist [ref=e914]:
                  - generic [ref=e915]:
                    - tab [selected] [ref=e916]:
                      - button "Python" [expanded] [ref=e917] [cursor=pointer]
                    - tab [ref=e918]:
                      - button "JavaScript" [ref=e919] [cursor=pointer]
                    - tab [ref=e920]:
                      - button "More Options" [ref=e921] [cursor=pointer]: arrow_drop_down More
                - tabpanel "Python" [ref=e922]:
                  - code [ref=e925]: "# example audio file to try: # URL = \"https://storage.googleapis.com/generativeai-downloads/data/hello_are_you_there.pcm\" # !wget -q $URL -O sample.pcm import asyncio from pathlib import Path from google import genai from google.genai import types client = genai.Client() model = \"gemini-3.1-flash-live-preview\" config = {\"response_modalities\": [\"AUDIO\"]} async def main(): async with client.aio.live.connect(model=model, config=config) as session: audio_bytes = Path(\"sample.pcm\").read_bytes() await session.send_realtime_input( audio=types.Blob(data=audio_bytes, mime_type=\"audio/pcm;rate=16000\") ) # if stream gets paused, send: # await session.send_realtime_input(audio_stream_end=True) async for response in session.receive(): if response.text is not None: print(response.text) if __name__ == \"__main__\": asyncio.run(main())"
              - paragraph [ref=e926]:
                - text: With
                - code [ref=e927]: send_realtime_input
                - text: ", the API will respond to audio automatically based on VAD. While"
                - code [ref=e928]: send_client_content
                - text: adds messages to the model context in order,
                - code [ref=e929]: send_realtime_input
                - text: is optimized for responsiveness at the expense of deterministic ordering.
              - heading "Automatic VAD configuration" [level=3] [ref=e930]
              - paragraph [ref=e931]:
                - text: For more control over the VAD activity, you can configure the following parameters. See
                - link "API reference" [ref=e932] [cursor=pointer]:
                  - /url: /api/live#automaticactivitydetection
                - text: for more info.
              - generic [ref=e934]:
                - tablist [ref=e935]:
                  - generic [ref=e936]:
                    - tab [selected] [ref=e937]:
                      - button "Python" [expanded] [ref=e938] [cursor=pointer]
                    - tab [ref=e939]:
                      - button "JavaScript" [ref=e940] [cursor=pointer]
                    - tab [ref=e941]:
                      - button "More Options" [ref=e942] [cursor=pointer]: arrow_drop_down More
                - tabpanel "Python" [ref=e943]:
                  - code [ref=e946]: "from google.genai import types config = { \"response_modalities\": [\"AUDIO\"], \"realtime_input_config\": { \"automatic_activity_detection\": { \"disabled\": False, # default \"start_of_speech_sensitivity\": types.StartSensitivity.START_SENSITIVITY_LOW, \"end_of_speech_sensitivity\": types.EndSensitivity.END_SENSITIVITY_LOW, \"prefix_padding_ms\": 20, \"silence_duration_ms\": 100, } } }"
              - heading "Disable automatic VAD" [level=3] [ref=e947]
              - paragraph [ref=e948]:
                - text: Alternatively, the automatic VAD can be disabled by setting
                - code [ref=e949]: realtimeInputConfig.automaticActivityDetection.disabled
                - text: to
                - code [ref=e950]: "true"
                - text: in the setup message. In this configuration the client is responsible for detecting user speech and sending
                - link [ref=e951] [cursor=pointer]:
                  - /url: /api/live#BidiGenerateContentRealtimeInput.FIELDS.BidiGenerateContentRealtimeInput.ActivityStart.BidiGenerateContentRealtimeInput.activity_start
                  - code [ref=e952]: activityStart
                - text: and
                - link [ref=e953] [cursor=pointer]:
                  - /url: /api/live#BidiGenerateContentRealtimeInput.FIELDS.BidiGenerateContentRealtimeInput.ActivityEnd.BidiGenerateContentRealtimeInput.activity_end
                  - code [ref=e954]: activityEnd
                - text: messages at the appropriate times. An
                - code [ref=e955]: audioStreamEnd
                - text: isn't sent in this configuration. Instead, any interruption of the stream is marked by an
                - code [ref=e956]: activityEnd
                - text: message.
              - generic [ref=e958]:
                - tablist [ref=e959]:
                  - generic [ref=e960]:
                    - tab [selected] [ref=e961]:
                      - button "Python" [expanded] [ref=e962] [cursor=pointer]
                    - tab [ref=e963]:
